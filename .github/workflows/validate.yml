name: Validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .[dev]
      - name: Run test suite
        run: pytest -q
      - name: Run CLI smoke
        run: python -m snowpack_patrollers.cli smoke --workdir ci_smoke --station-id ci_demo --skip-model
