[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowpack-patrollers"
version = "0.1.0"
description = "Locally testable SNOWPACK-for-patrollers workflow utilities for Colab and CLI use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
authors = [
  { name = "Austin Finnell" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.1",
  "requests>=2.31",
  "requests-cache>=1.2",
  "retry-requests>=2.0",
  "openmeteo-requests>=1.3",
  "ipyleaflet>=0.19",
  "ipywidgets>=8.1",
  "s3fs>=2024.6.0",
  "xarray>=2024.6.0",
  "h5netcdf>=1.3",
  "zarr>=2.18",
  "fsspec>=2024.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]
hrrr = [
  "herbie-data>=2025.5.0",
  "cfgrib>=0.9.15",
  "eccodes>=1.8.0",
]

[project.scripts]
snowpack-patrollers = "snowpack_patrollers.cli:main"

[tool.setuptools]
packages = ["snowpack_patrollers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
